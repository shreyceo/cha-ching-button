<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Cha-Ching Button</title>
  <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing:border-box; margin:0; padding:0; }

    body {
      font-family:'League Spartan',sans-serif;
      background:#0a0a0a;
      min-height:100vh;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      overflow:hidden;
    }

    #bg-canvas { position:fixed; top:0; left:0; width:100%; height:100%; z-index:0; pointer-events:none; }

    .page {
      position:relative; z-index:1;
      display:flex; flex-direction:column;
      align-items:center; gap:22px;
      padding:30px 20px; text-align:center;
    }

    /* TITLE */
    .title-block { display:flex; flex-direction:column; align-items:center; gap:4px; }
    .title {
      font-size:2.6rem; font-weight:900;
      letter-spacing:4px; text-transform:uppercase;
      color:#fff; line-height:1.15;
    }
    .title span {
      background:linear-gradient(90deg,#00ff87,#00e676,#69ff47,#00e676,#00ff87);
      background-size:300% auto;
      -webkit-background-clip:text; -webkit-text-fill-color:transparent;
      background-clip:text;
      animation:shimmer 3s linear infinite;
    }
    @keyframes shimmer { 0%{background-position:0% center} 100%{background-position:300% center} }

    .subtitle {
      font-size:13px;
      font-weight:800;
      letter-spacing:4px;
      color:rgba(0,230,118,0.7);
      text-transform:uppercase;
      margin-top:4px;
      animation:glow-text 2s ease-in-out infinite;
    }
    @keyframes glow-text {
      0%,100% { text-shadow:0 0 8px rgba(0,230,118,0.4); color:rgba(0,230,118,0.7); }
      50% { text-shadow:0 0 20px rgba(0,255,135,0.9),0 0 40px rgba(0,230,118,0.4); color:rgba(0,255,135,1); }
    }

    /* BUTTON */
    .btn-wrap { position:relative; display:flex; align-items:center; justify-content:center; }

    .btn-ring {
      position:absolute;
      width:230px; height:230px;
      border-radius:50%;
      border:2px solid rgba(0,230,118,0.3);
      animation:ring-pulse 2s ease-in-out infinite;
    }
    .btn-ring:nth-child(2) { width:260px; height:260px; border-color:rgba(0,230,118,0.15); animation-delay:0.5s; }
    .btn-ring:nth-child(3) { width:290px; height:290px; border-color:rgba(0,230,118,0.07); animation-delay:1s; }
    @keyframes ring-pulse {
      0%,100% { transform:scale(1); opacity:0.8; }
      50% { transform:scale(1.05); opacity:1; }
    }

    .btn-glow {
      position:absolute; inset:-40px; border-radius:50%;
      background:radial-gradient(circle,rgba(0,230,118,0.15) 0%,transparent 65%);
      animation:pulse-glow 2.5s ease-in-out infinite;
      pointer-events:none;
    }
    @keyframes pulse-glow { 0%,100%{transform:scale(1);opacity:0.6} 50%{transform:scale(1.2);opacity:1} }

    .ching-btn {
      width:200px; height:200px;
      border-radius:50%; border:none; cursor:pointer;
      background:none; outline:none;
      -webkit-tap-highlight-color:transparent;
      position:relative; z-index:2;
      transition:transform 0.08s, filter 0.08s;
      padding:0;
    }
    .ching-btn img {
      width:100%; height:100%;
      border-radius:50%;
      display:block;
      object-fit:cover;
      pointer-events:none;
      filter:drop-shadow(0 0 20px rgba(0,230,118,0.4));
      transition:filter 0.1s, transform 0.1s;
    }
    .ching-btn:hover img { filter:drop-shadow(0 0 35px rgba(0,255,135,0.7)) brightness(1.08); }
    .ching-btn.pressed { transform:scale(0.88); }
    .ching-btn.pressed img { filter:drop-shadow(0 0 50px rgba(0,255,135,1)) brightness(1.2); }

    /* COUNTER */
    .counter-wrap { display:flex; flex-direction:column; align-items:center; gap:3px; }
    .counter {
      font-size:3.8rem; font-weight:900;
      color:#00e676; letter-spacing:2px; line-height:1;
      transition:transform 0.08s;
      text-shadow:0 0 20px rgba(0,230,118,0.5);
    }
    .counter.bump { transform:scale(1.35); }
    .counter-label { font-size:11px; letter-spacing:3px; color:rgba(0,230,118,0.35); text-transform:uppercase; }

    /* STATS */
    .total-wrap {
      background:rgba(0,230,118,0.04);
      border:1px solid rgba(0,230,118,0.15);
      border-radius:14px;
      padding:14px 28px;
      display:flex; gap:28px; align-items:center;
    }
    .stat { display:flex; flex-direction:column; align-items:center; gap:2px; }
    .stat-val { font-size:1.4rem; font-weight:800; color:#00ff87; letter-spacing:1px; }
    .stat-lbl { font-size:10px; letter-spacing:2px; color:rgba(0,230,118,0.35); text-transform:uppercase; }
    .stat-divider { width:1px; height:36px; background:rgba(0,230,118,0.15); }

    /* COINS */
    .coin { position:fixed; font-size:22px; pointer-events:none; z-index:999; animation:coin-fly 1s ease-out forwards; }
    @keyframes coin-fly { 0%{opacity:1;transform:translate(0,0) scale(1) rotate(0deg)} 100%{opacity:0;transform:translate(var(--tx),var(--ty)) scale(0.2) rotate(720deg)} }

    /* TOAST */
    .toast {
      position:fixed; top:24px; left:50%;
      transform:translateX(-50%) translateY(-80px);
      background:rgba(0,230,118,0.1);
      border:1px solid rgba(0,230,118,0.4);
      backdrop-filter:blur(12px);
      border-radius:12px; padding:10px 24px;
      font-size:16px; font-weight:800;
      color:#00ff87; letter-spacing:3px;
      z-index:9999;
      transition:transform 0.4s cubic-bezier(0.34,1.56,0.64,1);
      white-space:nowrap;
    }
    .toast.show { transform:translateX(-50%) translateY(0); }

    /* RESET */
    .reset-btn {
      background:none;
      border:1px solid rgba(0,230,118,0.15);
      color:rgba(0,230,118,0.3);
      border-radius:8px; padding:7px 20px;
      font-family:'League Spartan',sans-serif;
      font-size:12px; font-weight:700; letter-spacing:1px;
      cursor:pointer; transition:all 0.2s;
    }
    .reset-btn:hover { border-color:rgba(0,230,118,0.4); color:rgba(0,230,118,0.7); }

        @media(max-width:480px) {
      .title{font-size:1.9rem}
      .ching-btn{width:160px;height:160px}
      .btn-ring{width:185px;height:185px}
      .counter{font-size:3rem}
      .total-wrap{gap:18px;padding:12px 18px}
    }
  </style>
</head>

    <div class="title">CHA-<span>CHING</span></div>

    <div class="subtitle">BY DESI RICH KID</div>
  </div>

<script>
/* INTERACTIVE BG — particles attract/repel to mouse */
(function() {
  var canvas = document.getElementById('bg-canvas');
  var ctx = canvas.getContext('2d');
  var W, H;
  var mouse = { x: -9999, y: -9999 };
  var particles = [];
  var NUM = 100;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  window.addEventListener('mousemove', function(e) {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });

  for (var i = 0; i < NUM; i++) {
    particles.push({
      x: Math.random() * 1920,
      y: Math.random() * 1080,
      ox: 0, oy: 0,
      vx: 0, vy: 0,
      r: Math.random() * 2 + 0.5,
      hue: 120 + Math.floor(Math.random() * 60),
      alpha: Math.random() * 0.5 + 0.2,
      speed: Math.random() * 0.4 + 0.1
    });
    particles[i].ox = particles[i].x;
    particles[i].oy = particles[i].y;
  }

  var ATTRACT_RADIUS = 180;
  var ATTRACT_FORCE  = 0.06;
  var RETURN_FORCE   = 0.025;
  var FRICTION       = 0.88;

  function draw() {
    ctx.clearRect(0, 0, W, H);

    /* draw connections */
    for (var i = 0; i < particles.length; i++) {
      for (var j = i + 1; j < particles.length; j++) {
        var dx = particles[i].x - particles[j].x;
        var dy = particles[i].y - particles[j].y;
        var d  = Math.sqrt(dx*dx + dy*dy);
        if (d < 120) {
          ctx.beginPath();
          ctx.strokeStyle = 'rgba(0,230,118,' + (0.15 * (1 - d/120)) + ')';
          ctx.lineWidth = 0.5;
          ctx.moveTo(particles[i].x, particles[i].y);
          ctx.lineTo(particles[j].x, particles[j].y);
          ctx.stroke();
        }
      }
    }

    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];

      /* mouse interaction — attract towards mouse */
      var mx = mouse.x - p.x;
      var my = mouse.y - p.y;
      var md = Math.sqrt(mx*mx + my*my);

      if (md < ATTRACT_RADIUS) {
        var force = (1 - md / ATTRACT_RADIUS) * ATTRACT_FORCE;
        p.vx += mx * force;
        p.vy += my * force;
      }

      /* return to origin */
      p.vx += (p.ox - p.x) * RETURN_FORCE;
      p.vy += (p.oy - p.y) * RETURN_FORCE;

      /* friction */
      p.vx *= FRICTION;
      p.vy *= FRICTION;

      p.x += p.vx;
      p.y += p.vy;

      /* glow near mouse */
      var distToMouse = Math.sqrt(Math.pow(mouse.x - p.x,2) + Math.pow(mouse.y - p.y,2));
      var glowBoost = distToMouse < 150 ? (1 - distToMouse/150) * 0.6 : 0;
      var alpha = p.alpha + glowBoost;
      var radius = p.r + glowBoost * 3;

      ctx.beginPath();
      ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
      ctx.fillStyle = 'hsla(' + p.hue + ',100%,60%,' + alpha + ')';
      ctx.fill();

      /* extra glow dot near mouse */
      if (glowBoost > 0.2) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, radius + 4, 0, Math.PI * 2);
        ctx.fillStyle = 'hsla(' + p.hue + ',100%,70%,' + (glowBoost * 0.3) + ')';
        ctx.fill();
      }
    }

    /* mouse spotlight */
    if (mouse.x > 0) {
      var spot = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, 160);
      spot.addColorStop(0, 'rgba(0,255,135,0.07)');
      spot.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = spot;
      ctx.fillRect(0, 0, W, H);
    }

    requestAnimationFrame(draw);
  }
  draw();
})();

var audioCtx = null;
var soundBuffer = null;
function getCtx() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); return audioCtx; }
function b64ToBuffer(b64) { var bin=atob(b64),buf=new ArrayBuffer(bin.length),view=new Uint8Array(buf); for(var i=0;i<bin.length;i++) view[i]=bin.charCodeAt(i); return buf; }
function loadSound() { if(soundBuffer) return; try { var ctx=getCtx(); ctx.decodeAudioData(b64ToBuffer(SOUND_B64),function(d){soundBuffer=d;console.log('Sound ready!');},function(e){console.log('decode error',e);}); } catch(e){console.log('load error',e);} }
function playSound() { try { var ctx=getCtx(); if(ctx.state==='suspended') ctx.resume(); if(!soundBuffer){loadSound();return;} var src=ctx.createBufferSource(); src.buffer=soundBuffer; src.connect(ctx.destination); src.start(0); } catch(e){console.log('play error',e);} }
document.addEventListener('click', loadSound, { once: true });

/* STATS */
var sessionCount = 0;
var allTime = parseInt(localStorage.getItem('chingTotal') || '0');
var streak = parseInt(localStorage.getItem('chingStreak') || '0');
var lastClick = 0, streakCount = 0;
function updateStats() {
  document.getElementById('stat-session').textContent = sessionCount;
  document.getElementById('stat-total').textContent = allTime;
  document.getElementById('stat-streak').textContent = streak;
}
updateStats();

function bumpCounter(n) {
  var el = document.getElementById('counter');
  el.textContent = n;
  el.classList.add('bump');
  setTimeout(function() { el.classList.remove('bump'); }, 120);
}

var coinList = ['&#128176;','&#129689;','&#128181;','&#129297;','&#128180;'];
function spawnCoins(x, y) {
  for (var i = 0; i < 12; i++) {
    var coin = document.createElement('div');
    coin.className = 'coin';
    coin.innerHTML = coinList[Math.floor(Math.random() * coinList.length)];
    var angle = Math.random() * Math.PI * 2;
    var dist = 80 + Math.random() * 160;
    coin.style.left = x + 'px';
    coin.style.top = y + 'px';
    coin.style.setProperty('--tx', (Math.cos(angle) * dist) + 'px');
    coin.style.setProperty('--ty', (Math.sin(angle) * dist - 80) + 'px');
    coin.style.animationDelay = (Math.random() * 0.15) + 's';
    document.body.appendChild(coin);
    setTimeout(function(c) { c.remove(); }, 1200, coin);
  }
}

var toastTimer;
var toasts = ['KA-CHING!', 'MONEY!', 'SALES!', 'PAID!', 'LETS GO!', 'TOP-G!', 'STACK IT!', 'BIG WINS!'];
function showToast() {
  var t = document.getElementById('toast');
  t.textContent = toasts[Math.floor(Math.random() * toasts.length)];
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function() { t.classList.remove('show'); }, 900);
}

function onChing() {
  playSound();
  sessionCount++;
  allTime++;
  localStorage.setItem('chingTotal', allTime);
  var now = Date.now();
  if (now - lastClick < 3000) {
    streakCount++;
    if (streakCount > streak) { streak = streakCount; localStorage.setItem('chingStreak', streak); }
  } else { streakCount = 1; }
  lastClick = now;
  bumpCounter(sessionCount);
  updateStats();
  showToast();
  var btn = document.getElementById('chingBtn');
  var rect = btn.getBoundingClientRect();
  spawnCoins(rect.left + rect.width / 2, rect.top + rect.height / 2);
  btn.classList.add('pressed');
  setTimeout(function() { btn.classList.remove('pressed'); }, 150);
}

function resetSession() {
  sessionCount = 0; streakCount = 0;
  document.getElementById('counter').textContent = '0';
  updateStats();
}

document.addEventListener('keydown', function(e) {
  if (e.code === 'Space' && e.target === document.body) { e.preventDefault(); onChing(); }
});
